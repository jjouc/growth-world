<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dbe6c5">
  <meta name="description" content="一步一方块，记录自己的成长。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <title>成长世界 · 一步一方块</title>
  <script src="./app.js" defer></script>
</head>
<body class="game-world">
  <div class="app-shell">
    <header class="game-header">
      <a class="brand" href="#today"><img src="./icon.svg" alt="" width="48" height="48"><span>成长世界<small>每天一小步，发现新宝藏</small></span></a>
      <nav aria-label="主导航">
        <button data-page="today" class="nav-item active"><span aria-hidden="true">⚑</span> 探宝地图</button>
        <button data-page="records" class="nav-item"><span aria-hidden="true">▤</span> 学习手册</button>
        <button data-page="rewards" class="nav-item"><span aria-hidden="true">◇</span> 村民商店</button>
      </nav>
      <div class="header-tools"><button class="wallet" id="wallet-btn" aria-label="查看绿宝石、钻石与奖励"><span class="emerald" aria-hidden="true"></span><strong id="balance">0</strong><span>绿宝石</span><span class="wallet-divider"></span><span class="diamond" aria-hidden="true"></span><strong id="diamond-balance">0</strong><span>钻石</span></button><button id="settings-btn" class="settings-button" aria-label="家长设置与备份" title="家长设置与备份">⚙</button></div>
    </header>
    <main>
      <div id="content" aria-live="polite"></div>
      <footer><span id="greeting">你好，小小建造师</span><span id="save-state" role="status">正在打开成长手册…</span></footer>
    </main>
  </div>
  <dialog id="editor" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" class="toast" hidden></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <noscript>请开启浏览器 JavaScript，才能打开成长手册。</noscript>
</body>
</html>
